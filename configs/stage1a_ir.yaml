output_dir: runs/stage1a_ir_50
model:
  backbone: Qwen/Qwen3-VL-2B-Instruct
  adapter_channels: 128
  fusion_type: parallel_backbone
  modality_dropout: 0.1
  fusion_residual_scale_init: 0.001
  parallel_fusion_stages: 1
  parallel_adapter_scale_init: 0.01
  query_encoder_layers: 1
  query_attention_heads: 4
  auxiliary_bbox_enabled: false
  vision_lora_enabled: false
data:
  stage: ir
  train_manifest: data/RGBT-Ground-Dataset/extracted/subsets/train_50.jsonl
  val_manifest: data/RGBT-Ground-Dataset/extracted/manifests/val.jsonl
  workers: 4
  min_pixels: 200704
  max_pixels: 802816
train:
  epochs: 3
  phase_a_epochs: 3
  phase_b_epochs: 0
  fusion_lr_a: 3.0e-05
  batch_size: 1
  grad_accumulation: 8
  val_batch_size: 1
  eval_subset_size: 512
  early_probe_steps: [50, 100, 300]
  early_probe_subset_size: 128
  max_new_tokens: 40
  weight_decay: 0.01
  amp: true
  seed: 2026
  gradient_checkpointing: true
