output_dir: runs/qwen3_vl_8b_rdt_qwen_city
model:
  backbone: Qwen/Qwen3-VL-8B-Instruct
  dtype: bfloat16
  adapter_channels: 256
  orthogonal_channels: 16
  fusion_type: rdt_deep
  rdt_shared_aux_patch_embed: true
  modality_dropout: 0.1
  fusion_residual_scale_init: 0.001
  fusion_zero_init_prompt_restore: true
  vision_lora_enabled: false
data:
  stage: joint
  train_manifest: ../city_detection_prepared/train/target_v2/qwen_generation_train_100.json
  val_manifest: ../city_detection_prepared/train/target_v2/qwen_generation_val.json
  workers: 4
  min_pixels: 200704
  max_pixels: 802816
  depth_scale: 1000.0
  depth_clip: 20.0
train:
  epochs: 2
  phase_a_epochs: 2
  phase_b_epochs: 0
  fusion_lr_a: 4.0e-05
  batch_size: 1
  grad_accumulation: 8
  val_batch_size: 1
  eval_subset_size: 412
  max_new_tokens: 40
  weight_decay: 0.01
  amp: true
  seed: 2026
  gradient_checkpointing: true
