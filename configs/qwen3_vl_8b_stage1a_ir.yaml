output_dir: runs/qwen3_vl_8b_e_stage1a_ir
model:
  backbone: Qwen/Qwen3-VL-8B-Instruct
  backbone_revision: main
  dtype: bfloat16
  adapter_channels: 256
  fusion_dim: 512
  fusion_attention_heads: 8
  fusion_mixer_dim: 2048
  query_dim: 128
  fusion_type: parallel_backbone
  modality_dropout: 0.2
  fusion_residual_scale_init: 1.0
  fusion_zero_init_prompt_restore: true
  parallel_fusion_stages: 4
  parallel_fusion_layer_indices: [8, 16, 24, 26]
  parallel_adapter_scale_init: 1.0
  parallel_joint_fusion: false
  query_encoder_layers: 1
  query_attention_heads: 4
  query_dropout: 0.0
  vision_lora_enabled: false
data:
  stage: ir
  train_manifest: /root/autodl-tmp/datasets/RGBT-Ground-Dataset/extracted/subsets/train_50.jsonl
  val_manifest: /root/autodl-tmp/datasets/RGBT-Ground-Dataset/extracted/manifests/val.jsonl
  workers: 4
  min_pixels: 200704
  max_pixels: 802816
train:
  epochs: 3
  phase_a_epochs: 3
  phase_b_epochs: 0
  fusion_lr_a: 3.0e-05
  batch_size: 1
  grad_accumulation: 16
  val_batch_size: 1
  eval_subset_size: 512
  max_new_tokens: 40
  weight_decay: 0.01
  amp: true
  seed: 2026
  gradient_checkpointing: true
