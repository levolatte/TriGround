<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>多模态测试集人工筛选</title>
  <style>
    :root{color-scheme:dark;--bg:#090f15;--panel:#111b25;--line:#26394b;--text:#edf4fb;--muted:#91a5b9;--blue:#55c2ff;--green:#49d17d;--yellow:#ffc857;--red:#ff667a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,"Segoe UI",sans-serif;overflow:hidden}
    button,select,input,textarea{font:inherit}button{color:var(--text);background:#192735;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}button:hover{border-color:var(--blue)}button.selected,button.active{outline:2px solid var(--blue);background:#19425a}
    header{height:58px;display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:#0d1620}.brand{font-weight:700;font-size:16px}.grow{flex:1}.pill{padding:5px 9px;background:#182634;border-radius:999px;color:var(--muted)}
    .layout{height:calc(100vh - 58px);min-height:0;overflow:hidden;display:grid;grid-template-columns:370px minmax(0,1fr)}aside{height:100%;min-height:0;overflow:hidden;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.filters{flex:0 0 auto;padding:9px;display:grid;grid-template-columns:1fr 1fr;gap:7px;border-bottom:1px solid var(--line)}select,input,textarea{color:var(--text);background:#0c151e;border:1px solid var(--line);border-radius:7px;padding:7px}.list{min-height:0;overflow:auto;flex:1 1 auto}.item{padding:10px;border-bottom:1px solid #1c2b38;cursor:pointer}.item:hover{background:#15232f}.item.active{background:#173448;box-shadow:inset 3px 0 var(--blue)}.item.done::after{content:"✓";float:right;color:var(--green);font-weight:800}.meta{color:var(--muted);font-size:12px;margin-top:4px}
    main{height:100%;min-width:0;min-height:0;display:grid;grid-template-rows:44px minmax(260px,1fr) 224px;overflow:hidden}.toolbar{padding:6px 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}.viewer{position:relative;min-height:0;overflow:hidden;background:#05090d}.source-image,canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.source-image{object-fit:contain}.viewer canvas{pointer-events:none}.legend{position:absolute;z-index:2;left:12px;bottom:10px;background:#060b10dc;border:1px solid var(--line);padding:6px 9px;border-radius:7px}.review{overflow:auto;border-top:1px solid var(--line);background:var(--panel);padding:10px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.label{color:var(--muted);width:82px}.query{display:grid;grid-template-columns:82px 1fr auto;gap:7px;margin-bottom:8px}.query input{min-width:0}.destination[data-value=test]{border-color:#2d8db9}.destination[data-value=train_supplement]{border-color:#8a6fb8}.decision[data-value=valid]{border-color:#287d4c}.decision[data-value=exclude],.decision[data-value=wrong_bbox]{border-color:#8d3542}textarea{width:100%;height:40px;resize:none}.hint{color:#b5c7d8;font-size:12px}.status{color:var(--muted)}#toast{position:fixed;right:18px;top:70px;background:#173448;border:1px solid var(--blue);padding:9px 13px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}#toast.show{opacity:1}
    @media(max-width:900px){.layout{grid-template-columns:310px 1fr}.brand{display:none}}
  </style>
</head>
<body>
  <header><div class="brand">多模态测试集人工筛选</div><button id="prev">← 上一条</button><button id="next">下一条 →</button><span class="pill" id="position"></span><span class="pill" id="progress"></span><div class="grow"></div><span class="status" id="saveStatus">未修改</span><a href="/api/export" download="candidate_reviews.json"><button>导出审核 JSON</button></a></header>
  <div class="layout">
    <aside><div class="filters"><select id="filter"><option value="all">全部候选</option><option value="incomplete">未完成</option><option value="test">测试集</option><option value="train_supplement">补充训练集</option><option value="hold">暂缓</option><option value="excluded">已排除</option></select><select id="sort"><option value="original">原始顺序</option><option value="light">按光照</option><option value="scale">按尺度</option><option value="class">按类别</option></select></div><div class="list" id="list"></div></aside>
    <main>
      <div class="toolbar"><button class="modality active" data-value="visible">RGB [1]</button><button class="modality" data-value="infrared">红外 [2]</button><button class="modality" data-value="depth">深度 [3]</button><button id="allBoxes" class="active">全部框 [G]</button><div class="grow"></div><span class="hint" id="coverage"></span></div>
      <div class="viewer" id="viewer"><img id="sourceImage" class="source-image" alt="当前模态图像"><canvas id="canvas"></canvas><div class="legend">绿色：当前 GT　黄色：同场景其他 GT</div></div>
      <section class="review">
        <div class="query"><span class="label">修正描述</span><input id="corrected" placeholder="原描述正确则留空"><button id="saveQuery">保存修正</button></div>
        <div class="row"><span class="label">数据质量</span><button class="decision" data-value="valid">有效 [A]</button><button class="decision" data-value="ambiguous">描述歧义 [Q]</button><button class="decision" data-value="wrong_bbox">框错误 [B]</button><button class="decision" data-value="modality_misaligned">模态错位 [X]</button><button class="decision" data-value="tiny_unusable">不可辨认 [T]</button><button class="decision" data-value="exclude">排除 [D]</button></div>
        <div class="row"><span class="label">数据去向</span><button class="destination" data-value="test">测试集 [S]</button><button class="destination" data-value="train_supplement">补充训练 [R]</button><button class="destination" data-value="hold">暂缓 [H]</button></div>
        <div class="row"><span class="label">模态需求</span><button class="need" data-value="rgb">RGB足够 [4]</button><button class="need" data-value="ir">需要IR [5]</button><button class="need" data-value="depth">需要Depth [6]</button><button class="need" data-value="ir_depth">IR+Depth [7]</button><button class="need" data-value="uncertain">不确定 [8]</button></div>
        <textarea id="note" placeholder="可选备注，例如：夜间IR轮廓更清晰、Depth与RGB错位等；失焦后自动保存"></textarea>
      </section>
    </main>
  </div><div id="toast"></div>
  <script>
    const state={data:null,reviews:{},items:[],index:0,modality:'visible',image:null,showAll:true};const $=x=>document.getElementById(x);
    const complete=r=>['valid','query_corrected'].includes(r?.decision)&&['test','train_supplement'].includes(r?.destination)&&!!r?.modality_need;
    async function boot(){const r=await fetch('/api/bootstrap');state.data=await r.json();state.reviews=state.data.review_state.reviews||{};applyFilter();render()}
    function allItems(){return state.data.scenes.flatMap(scene=>scene.samples.map(sample=>({scene,sample})))}function current(){return state.items[state.index]}
    function applyFilter(){let items=allItems(),f=$('filter').value;if(f==='incomplete')items=items.filter(x=>!complete(state.reviews[x.sample.id]));else if(f==='excluded')items=items.filter(x=>['exclude','ambiguous','wrong_bbox','modality_misaligned','tiny_unusable'].includes(state.reviews[x.sample.id]?.decision));else if(f!=='all')items=items.filter(x=>state.reviews[x.sample.id]?.destination===f);const s=$('sort').value;if(s!=='original')items.sort((a,b)=>String(a.sample.candidate_metadata?.[s==='light'?'light_bin':s==='scale'?'scale_bin':s]||a.sample[s]||'').localeCompare(String(b.sample.candidate_metadata?.[s==='light'?'light_bin':s==='scale'?'scale_bin':s]||b.sample[s]||'')));state.items=items;state.index=Math.min(state.index,Math.max(0,items.length-1))}
    function render(){const x=current();if(!x){$('list').replaceChildren();$('position').textContent='没有符合筛选条件的候选';return}const reviewed=Object.values(state.reviews).filter(complete).length;$('position').textContent=`${state.index+1}/${state.items.length} · ${x.sample.id}`;$('progress').textContent=`完整审核 ${reviewed}/${state.data.sample_count}`;renderList();renderReview();loadImage();const m=x.sample.candidate_metadata||{};$('coverage').textContent=`${x.sample.class_name} · ${x.sample.scale_bin||'-'} · ${m.query_type||'-'} · ${m.light_bin||'-'} · RGB亮度 ${m.brightness??'-'} · IR对比度 ${m.ir_contrast??'-'}`}
    function renderList(){const box=$('list');box.replaceChildren();const start=Math.max(0,state.index-25),end=Math.min(state.items.length,start+60);for(let i=start;i<end;i++){const x=state.items[i],r=state.reviews[x.sample.id]||{},d=document.createElement('div');d.className='item'+(i===state.index?' active':'')+(complete(r)?' done':'');d.innerHTML=`<div>${i+1}. ${escapeHtml(r.corrected_query||x.sample.query)}</div><div class="meta">${x.sample.class_name} · ${x.sample.scale_bin||'-'} · ${r.destination||'未分配'} · ${r.modality_need||'未标模态'}</div>`;d.onclick=()=>{state.index=i;render()};box.append(d)}const active=box.querySelector('.active');active?.scrollIntoView({block:'nearest'})}
    function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}function renderReview(){const r=state.reviews[current().sample.id]||{};document.querySelectorAll('.decision').forEach(b=>b.classList.toggle('selected',b.dataset.value===r.decision));document.querySelectorAll('.destination').forEach(b=>b.classList.toggle('selected',b.dataset.value===r.destination));document.querySelectorAll('.need').forEach(b=>b.classList.toggle('selected',b.dataset.value===r.modality_need));$('corrected').value=r.corrected_query||'';$('corrected').placeholder='原描述：'+current().sample.query;$('note').value=r.note||''}
    function loadImage(){const x=current(),img=$('sourceImage');state.image=null;img.onload=()=>{state.image=img;$('saveStatus').textContent='图片已加载';requestAnimationFrame(draw)};img.onerror=()=>{$('saveStatus').textContent='图片加载失败';toast('无法加载：'+x.scene[state.modality])};img.src='/image?path='+encodeURIComponent(x.scene[state.modality])}function draw(){const c=$('canvas'),v=$('viewer'),r=v.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);const ctx=c.getContext('2d');ctx.scale(d,d);ctx.clearRect(0,0,r.width,r.height);if(!state.image||!state.image.naturalWidth)return;const s=Math.min(r.width/state.image.naturalWidth,r.height/state.image.naturalHeight),w=state.image.naturalWidth*s,h=state.image.naturalHeight*s,ox=(r.width-w)/2,oy=(r.height-h)/2;const x=current();if(state.showAll)x.scene.samples.forEach(q=>paint(ctx,q.bbox,q.id===x.sample.id?'#54ff77':'#ffe05c',ox,oy,w,h));else paint(ctx,x.sample.bbox,'#54ff77',ox,oy,w,h)}function paint(ctx,b,color,ox,oy,w,h){ctx.strokeStyle=color;ctx.lineWidth=4;ctx.strokeRect(ox+b[0]*w,oy+b[1]*h,(b[2]-b[0])*w,(b[3]-b[1])*h)}
    async function save(patch){const id=current().sample.id;$('saveStatus').textContent='保存中…';const response=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sample_ids:[id],patch})}),data=await response.json();if(!data.ok){toast(data.error);$('saveStatus').textContent='保存失败';return}Object.assign(state.reviews,data.updated);$('saveStatus').textContent='已自动保存';renderReview();renderList();$('progress').textContent=`完整审核 ${Object.values(state.reviews).filter(complete).length}/${state.data.sample_count}`}
    function move(n){state.index=Math.max(0,Math.min(state.items.length-1,state.index+n));render()}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
    document.querySelectorAll('.decision').forEach(b=>b.onclick=()=>{const currentReview=state.reviews[current().sample.id]||{};save({decision:currentReview.decision===b.dataset.value?null:b.dataset.value})});document.querySelectorAll('.destination').forEach(b=>b.onclick=()=>save({destination:b.dataset.value}));document.querySelectorAll('.need').forEach(b=>b.onclick=()=>save({modality_need:b.dataset.value}));document.querySelectorAll('.modality').forEach(b=>b.onclick=()=>{state.modality=b.dataset.value;document.querySelectorAll('.modality').forEach(x=>x.classList.toggle('active',x===b));loadImage()});
    $('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('allBoxes').onclick=()=>{state.showAll=!state.showAll;$('allBoxes').classList.toggle('active',state.showAll);draw()};$('saveQuery').onclick=()=>{const q=$('corrected').value.trim();if(!q)return toast('请输入修正描述');save({corrected_query:q})};$('note').onblur=()=>save({note:$('note').value});$('filter').onchange=$('sort').onchange=()=>{state.index=0;applyFilter();render()};
    addEventListener('resize',draw);addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;const key=e.key.toLowerCase();if(key==='arrowleft'||key==='k')move(-1);else if(key==='arrowright'||key==='j'||key==='n'||key===' ')move(1);else if(['1','2','3'].includes(key))document.querySelectorAll('.modality')[Number(key)-1].click();else if(key==='g')$('allBoxes').click();else if({a:'valid',q:'ambiguous',b:'wrong_bbox',x:'modality_misaligned',t:'tiny_unusable',d:'exclude'}[key]){const decision={a:'valid',q:'ambiguous',b:'wrong_bbox',x:'modality_misaligned',t:'tiny_unusable',d:'exclude'}[key],currentReview=state.reviews[current().sample.id]||{};save({decision:currentReview.decision===decision?null:decision})}else if({s:'test',r:'train_supplement',h:'hold'}[key])save({destination:{s:'test',r:'train_supplement',h:'hold'}[key]});else if(['4','5','6','7','8'].includes(key))save({modality_need:{4:'rgb',5:'ir',6:'depth',7:'ir_depth',8:'uncertain'}[key]})});boot().catch(e=>{document.body.textContent='加载失败：'+e})
  </script>
</body></html>
