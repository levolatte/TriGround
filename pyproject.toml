[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-grounding-adapters"
version = "0.1.0"
description = "Qwen3-VL RGB/thermal/depth referring-expression grounding"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "sentencepiece>=0.2,<1",
  "torch>=2.1",
  "transformers>=4.57.3,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
